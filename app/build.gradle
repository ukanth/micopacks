apply plugin: 'com.android.application'

android {
    compileSdk 36
    defaultConfig {
        applicationId "dev.ukanth.iconmanager"
        minSdkVersion 21
        targetSdk 36
        versionCode 20261012
        versionName "6.0.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                // Room writes each schema version here so migrations can be reviewed and tested
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'dev.ukanth.iconmgr'
    lint {
        abortOnError false
    }

}



dependencies {
    def libsuVersion = '6.0.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.vectordrawable:vectordrawable-animated:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"

    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'

    //lifecycle (ViewModel + LiveData for the pack list)
    def lifecycle_version = "2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"

    //root library
    //implementation 'eu.chainfire:libsuperuser:1.0.0.201602271131'
    //noinspection GradleDependency
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"



    //gson
    implementation 'com.google.code.gson:gson:2.11.0'

    //prettytime
    implementation 'org.ocpsoft.prettytime:prettytime:5.0.4.Final'

    //room
    def room_version = "2.6.1"

    //noinspection GradleDependency
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // Testing
    testImplementation 'junit:junit:4.13.2'
    // real XmlPullParser for JVM tests of the appfilter parser (android.jar only has stubs)
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
